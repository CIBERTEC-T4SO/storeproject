<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento de Proveedores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; }
        .sidebar { min-height: 100vh; position: fixed; }
        footer { background-color: #f8f9fa; padding: 1rem; text-align: center; border-top: 1px solid #dee2e6; }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block bg-white sidebar p-3 border-end">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link active" href="/proveedor/mantenimiento">Lista de Proveedores</a></li>
                <li class="nav-item"><a class="nav-link active" href="/proveedor/guardar">Guardar Proveedor</a></li>
                <!-- Agrega más enlaces si lo necesitas -->
            </ul>
        </nav>
        <!-- Main Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="pt-4 pb-2 mb-4 border-bottom d-flex justify-content-between align-items-center">
                <h2>Mantenimiento de Proveedores</h2>
                <button class="btn btn-success" onclick="abrirModalProveedor()">+ Nuevo Proveedor</button>
            </div>
            <!-- Tabla de proveedores -->
            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>DNI</th>
                        <th>Nombre</th>
                        <th>Teléfono</th>
                        <th>Email</th>
                        <th>País</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Ejemplo de fila -->
                    <tr th:each="prov:${lista}">
                        <td th:text="${prov.id}"></td>
                        <td th:text="${prov.doc}"></td>
                        <td th:text="${prov.nombre}"></td>
                        <td th:text="${prov.telefono}"></td>
                        <td th:text="${prov.email}"></td>
                        <td th:text="${prov.pais.name}"></td>
                        <td>
<!--                            <button type="button" class="btn btn-outline-warning btn-sm" onclick="abrirModalProveedor(true)">✏️ Editar</button>-->
<!--                            <button type="button" class="btn btn-outline-danger btn-sm" onclick="abrirModalEliminar()">🗑️ Eliminar</button>-->
                            <a th:href="@{/proveedor/editar/{id}(id=${prov.id})}">✏️</a>
                            <a th:href="@{/proveedor/eliminar/{id}(id=${prov.id})}" onclick="return confirm('¿Está seguro de eliminar este proveedor?');">🗑️</a>
                        </td>
                    </tr>
                    <!-- Más filas aquí -->
                    </tbody>
                </table>
            </div>

        </main>
    </div>
</div>
<!-- Modal Crear/Editar Proveedor -->
<div class="modal fade" id="modalProveedor" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form>
                <div class="modal-header">
                    <h5 class="modal-title">Proveedor</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="dni" class="form-label">DNI</label>
                        <input type="text" class="form-control" id="dni" required>
                    </div>
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" required>
                    </div>
                    <div class="mb-3">
                        <label for="telefono" class="form-label">Teléfono</label>
                        <input type="tel" class="form-control" id="telefono" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="pais" class="form-label">País</label>
                        <input type="text" class="form-control" id="pais">
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<!-- Modal Eliminar Proveedor -->
<div class="modal fade" id="modalEliminarProveedor" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Eliminar Proveedor</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                ¿Estás seguro de que deseas eliminar este proveedor?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger">Eliminar</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function abrirModalProveedor(editar = false) {
        new bootstrap.Modal(document.getElementById('modalProveedor')).show();
        // Aquí puedes cargar datos si es edición
    }
    function abrirModalEliminar() {
        new bootstrap.Modal(document.getElementById('modalEliminarProveedor')).show();
    }
</script>
</body>
</html>
