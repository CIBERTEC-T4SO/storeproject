<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" >
</head>
<body>

<h2 th:text="${mensaje}" ></h2>
<form th:action="@{/proveedor/guardar}" th:object="${proveedor}" method="post" class="container mt-4">
    <input type="hidden" th:field="*{id}" />

    <div class="mb-3">
        <label for="doc" class="form-label">Documento</label>
        <input type="text" class="form-control" id="doc" th:field="*{doc}" placeholder="Ingrese su documento">
    </div>

    <div class="mb-3">
        <label for="name" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="Ingrese su nombre">
    </div>

    <div class="mb-3">
        <label for="telefono" class="form-label">Teléfono</label>
        <input type="text" class="form-control" id="telefono" th:field="*{telefono}" placeholder="Ingrese su teléfono">
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="Ingrese su email">
    </div>

    <div class="mb-3">
        <label for="pais" class="form-label">País</label>
        <select class="form-select" id="pais" th:field="*{pais.id}">
            <option th:each="p : ${paises}" th:value="${p.id}" th:text="${p.name}">País</option>
        </select>
    </div>

    <div class="mb-3 text-center">
        <button type="submit" class="btn btn-primary">Grabar</button>
    </div>
</form>


<hr>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Doc. Número</th>
        <th>Nombre</th>
        <th>Teléfono</th>
        <th>Email</th>
        <th>País</th>
        <th>Opciones</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="prov : ${lista}">
        <td th:text="${prov.id}"></td>
        <td th:text="${prov.doc}"></td>
        <td th:text="${prov.name}"></td>
        <td th:text="${prov.telefono}"></td>
        <td th:text="${prov.email}"></td>
        <td th:text="${prov.pais.name}"></td>
        <td>
        <a th:href="@{/proveedor/editar(id=${prov.id})}"> Editar</a>
            <a th:href="@{/proveedor/eliminar/{id}(id=${prov.id})}"
            onclick="return confirm('¿Está seguro de eliminar este proveedor?');"
            >Eliminar</a>

        </td>


    </tr>

    </tbody>

</table>

</body>
</html>
