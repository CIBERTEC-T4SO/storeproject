<!doctype html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Guardar</title>

    <link href="cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" >

</head>

<body>

<form th:action="@{/proveedor/guardar}" th:object="${proveedor}" method="post" >
    <div>
        <label>DNI</label>
        <input type="text" th:field="*{proveedor.doc}" class="form-control">
    </div>
    <div>
        <label>Nombre</label>
        <input type="text" th:field="*{proveedor.nombre}" class="form-control">
    </div>
    <div>
        <label>Teléfono</label>
        <input type="text" th:field="*{proveedor.phone}" class="form-control">
    </div>
    <div>
        <label>Email</label>
        <input type="mail" th:field="*{proveedor.email}" class="form-control">
    </div>
    <div>
        <label>País</label>
        <select th:field="*{proveedor.pais}" class="form-control">
            <option th:each="pais : ${pais}">
        </select>
    </div>
    <hr>

    <button type="submit" class="btn btn-primary">Guardar</button>
</form>




</body>

</html>
