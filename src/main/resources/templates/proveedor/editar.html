<!doctype html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Editar Proveedor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .card {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .form-label {
            font-weight: 500;
        }
    </style>

</head>

<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white text-center">
                        <h4 class="mb-0">Editar Proveedor</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/proveedor/guardar}" th:object="${proveedor}" method="post">
                            <input type="hidden" th:field="*{id}" />

                            <div class="mb-3">
                                <label for="doc" class="form-label">Documento</label>
                                <input type="text" class="form-control" id="doc" th:field="*{doc}"
                                    placeholder="Ingrese su documento">
                            </div>

                            <div class="mb-3">
                                <label for="name" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="name" th:field="*{nombre}"
                                    placeholder="Ingrese su nombre">
                            </div>

                            <div class="mb-3">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <input type="text" class="form-control" id="telefono" th:field="*{telefono}"
                                    placeholder="Ingrese su teléfono">
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" th:field="*{email}"
                                    placeholder="Ingrese su email">
                            </div>

                            <div class="mb-3">
                                <label for="pais" class="form-label">País</label>
                                <select class="form-select" id="pais" th:field="*{pais.id}">
                                    <option value="" disabled>Seleccione un país</option>
                                    <option th:each="pais : ${paises}" th:value="${pais.id}" th:text="${pais.name}"></option>
                                </select>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Grabar</button>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer text-center">
                        <a th:href="@{/proveedor/mantenimiento}" class="btn btn-link">Volver a la lista</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
