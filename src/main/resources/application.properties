# NOMBRE DE LA APLICACIÓN
# Solo informativo. Se puede usar para logs, monitoreo, etc.
spring.application.name=Store_Project

# PARA CAMBIAR DE PUERTO POR DEFECTO
# server.port=8080


# CONFIGURACIÓN DE CONEXIÓN A LA BASE DE DATOS

# Dirección de la base de datos MySQL y configuración de caracteres.
# - useSSL=false ? evita advertencias de conexión segura.
# - allowPublicKeyRetrieval=true ? permite autenticación en MySQL 8+.
# - useUnicode=true & characterEncoding=utf8 ? asegura soporte para acentos y caracteres especiales.
spring.datasource.url=jdbc:mysql://localhost:3306/bd_store?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8

# Usuario y contraseña de acceso a la base de datos.
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Driver JDBC para conectar con MySQL (necesario para que funcione con Spring Boot).
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# CONFIGURACIÓN DE JPA Y HIBERNATE

# Controla el comportamiento de creación de tablas:
# - create-drop ? Crea tablas al iniciar y las elimina al cerrar.
# - update ? Crea/modifica estructuras sin eliminar datos.
# - none ? No hace nada (ideal si ya tienes las tablas creadas).
# Recomendado: usar "none" si trabajas con una BD ya existente.
spring.jpa.hibernate.ddl-auto=create-drop

# Usa exactamente los nombres de columnas y tablas que defines en las entidades.
# Si no usas esto, Hibernate puede cambiar nombres a snake_case (ej. nombreCliente ? nombre_cliente).
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


# Configuración de la conexión a la base de datos.
# importando las propiedades desde un archivo externo.
spring.config.import=file:env.properties


