spring.application.name=Store_Project 
server.port=8000

spring.datasource.url=jdbc:mysql://localhost:3306/TIENDA04?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
#Mostrar las consultas SQL en la consola
spring.jpa.show-sql=true

# Inicializar la base de datos al arrancar la aplicaci�n
spring.sql.init.mode=always

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
#spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.config.import=file:env.properties

api.endpoint.regiones.peru=https://gob.pe/regiones/api/peru/v1


#Propiedad Personalziada del sistema
user.master=admincito
##
mantenimiento=false
mensaje.mantenimiento=Hola estamos en mantenimiento, disculpa las molestias
mensaje.mantenimiento.no=Biemvenido al sistema, no estamos en mantenimiento